<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外媒涉华新闻聚合站</title>
    <style>
        * {margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, "Microsoft Yahei", sans-serif;}
        body {background:#f5f7fa; color:#222; padding:20px; max-width:1400px; margin:0 auto;}
        header {background:#fff; border-radius:12px; padding:24px; margin-bottom:20px; box-shadow:0 2px 10px #0000000a;}
        h1 {font-size:26px; margin-bottom:10px; color:#1a365d;}
        .meta-info {color:#666; font-size:14px; line-height:1.8;}
        .source-stats {margin-top:12px; display:flex; flex-wrap:wrap; gap:8px;}
        .tag {background:#e6f0ff; color:#0056b3; padding:4px 10px; border-radius:20px; font-size:13px;}
        .media-block {background:#fff; border-radius:12px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px #00000008;}
        .media-title {font-size:18px; font-weight:600; margin-bottom:14px; color:#112948; border-left:4px solid #0066cc; padding-left:12px;}
        .news-item {border-bottom:1px solid #eee; padding:14px 8px; cursor:pointer; transition:background 0.2s;}
        .news-item:hover {background:#f0f7ff;}
        .cn-title {font-size:16px; font-weight:500; margin-bottom:4px; color:#111;}
        .en-title {font-size:13px; color:#666; line-height:1.5;}
        .pub-time {font-size:12px; color:#888; margin-top:6px;}
        .loading {text-align:center; padding:60px; font-size:18px; color:#555;}
        .error-box {color:#dc2626; text-align:center; padding:60px; font-size:16px; line-height:1.8;}
    </style>
</head>
<body>
    <header>
        <h1>🌍 境外媒体涉华新闻聚合</h1>
        <div class="meta-info">
            <div id="update-time">加载中...</div>
            <div id="total-count"></div>
            <div class="source-stats" id="stats-container"></div>
        </div>
    </header>
    <main id="news-container">
        <div class="loading">正在拉取最新新闻数据，请稍候...</div>
    </main>

    <script>
        async function loadNews() {
            const container = document.getElementById("news-container");
            try {
                const res = await fetch("./news.json");
                // 网络404/500兜底
                if (!res.ok) {
                    container.innerHTML = `<div class="error-box">无法读取新闻数据文件<br>请前往Actions手动运行一次爬虫生成news.json</div>`;
                    return;
                }
                const data = await res.json();

                // 场景1：爬虫报错，仅返回error字段
                if (data.error) {
                    container.innerHTML = `<div class="error-box">爬虫采集失败：${data.error}<br>重新运行Actions爬虫任务重试</div>`;
                    return;
                }

                // 场景2：关键字段不存在兜底
                if (!data || !Array.isArray(data.news) || !data.source_stat) {
                    container.innerHTML = `<div class="error-box">新闻数据格式异常，等待下一轮自动采集更新</div>`;
                    return;
                }

                // 顶部更新时间、总数
                document.getElementById("update-time").innerText = `最后自动更新：${data.update_cst || "未知"}`;
                document.getElementById("total-count").innerText = `当前新闻总数：${data.total_count || 0} 条`;

                // 来源标签
                const statsBox = document.getElementById("stats-container");
                statsBox.innerHTML = "";
                Object.entries(data.source_stat).forEach(([src, cnt])=>{
                    const tag = document.createElement("span");
                    tag.className = "tag";
                    tag.innerText = `${src}：${cnt}条`;
                    statsBox.appendChild(tag);
                })

                // 按媒体分组
                const groupMap = {};
                data.news.forEach(item=>{
                    if(!groupMap[item.source]) groupMap[item.source] = [];
                    groupMap[item.source].push(item);
                })

                container.innerHTML = "";
                Object.entries(groupMap).forEach(([media, newsArr])=>{
                    const block = document.createElement("div");
                    block.className = "media-block";
                    block.innerHTML = `<div class="media-title">${media}（${newsArr.length}条）</div>`;
                    newsArr.forEach(news=>{
                        const itemDom = document.createElement("div");
                        itemDom.className = "news-item";
                        itemDom.innerHTML = `
                            <div class="cn-title">${news.title_cn || "无中文标题"}</div>
                            <div class="en-title">原文：${news.title_en || "无标题"}</div>
                            <div class="pub-time">发布时间：${news.pub_sort_dt || news.pub_raw || "未知时间"}</div>
                        `;
                        // 链接存在才允许点击
                        if (news.url) itemDom.onclick = ()=> window.open(news.url, "_blank");
                        block.appendChild(itemDom);
                    })
                    container.appendChild(block);
                })

                // 无新闻兜底
                if (data.news.length === 0) {
                    container.innerHTML = `<div class="error-box">暂无符合条件的新闻，等待下一轮采集</div>`;
                }
            } catch (err) {
                container.innerHTML = `<div class="error-box">数据加载异常：${err.message}<br>1.检查Actions爬虫是否运行成功<br>2.等待整点自动重新采集</div>`;
                console.error("加载失败详情：", err);
            }
        }
        window.onload = loadNews;
    </script>
</body>
</html>
