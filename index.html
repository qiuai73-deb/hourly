
html = r'''<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>境外媒体新闻聚合</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#f5f7fa;
    color:#222;
    font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif
}

    max-width:1200px;
    margin:0 auto;
    padding:18px
}

    background:#fff;

}

    padding:20px;

}

    margin:0 0 8px;

}

    color:#666;

}

    display:flex;

}

    background:#edf5ff;

}

}

    font-size:20px;

}

    border-left-color:#1677c8
}

    padding:13px 6px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    transition:background .2s
}

    border-bottom:0
}
.news-item:hover{
    background:#f5f9fd
}
.news-title{
    font-size:16px;
    line-height:1.55;
    font-weight:600;
    color:#111
}
.news-info{
    margin-top:5px;
    color:#888;
    font-size:12px;
    display:flex;
    gap:14px;
    flex-wrap:wrap
}

    color:#555;
    font-weight:500
}
.loading,.empty,.error{
    padding:45px 15px;
    text-align:center;

}

    color:#c62828;

}
@media(max-width:700px){
    .wrap{padding:10px}
    header,.section{padding:14px}

    .news-title{font-size:15px}
}
</style>
</head>

<body>
<div class="wrap">

<header>
    <h1>🌍 境外媒体新闻聚合</h1>
    <div class="meta" id="update">正在加载……</div>
    <div class="meta" id="count"></div>
    <div class="tags" id="stats"></div>
</header>

<main id="app">
    <div class="loading">正在加载最新新闻……</div>
</main>

</div>

<script>
/*
 * 与新版 crawler.py 对应：
 *
 * data.china_news
 *   └─ China Buzzing 最新10条
 *
 * data.media_news
 *   └─ Economist / Bloomberg / FT / WSJ / Reuters
 *      五个源已经在 Python 中混编并排序
 *      网页只取最新20条
 *
 * 注意：
 * 不显示摘要
 * 不显示英文原标题
 * 不按照媒体分组
 */

function escapeHtml(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/*
 * Python 已经把时间转换成北京时间。
 * 这里主要负责排序。
 */
function getTime(item){
    const value = item && (item.pub_sort_dt || item.pub_raw);

    if(!value) return 0;

    const timestamp = Date.parse(value);

    return Number.isNaN(timestamp) ? 0 : timestamp;
}


function sortNewest(items){
    if(!Array.isArray(items)) return [];

    return [...items].sort((a,b)=>{
        return getTime(b) - getTime(a);
    });
}


/*
 * 每条新闻只显示：
 *
 * 中文标题
 * 来源
 * 发布时间
 *
 * 不显示：
 * title_en
 * summary
 * summary_cn
 */
function createNewsItem(news){

    const item = document.createElement("article");

    item.className = "news-item";

    const title =
        news.title_cn ||
        news.title_en ||
        "无标题";

    const source =
        news.source ||
        "未知来源";

    const time =
        news.pub_sort_dt ||
        news.pub_raw ||
        "未知时间";

    item.innerHTML = `
        <div class="news-title">
            ${escapeHtml(title)}
        </div>

        <div class="news-info">
            <span class="news-source">
                来源：${escapeHtml(source)}
            </span>

            <span>
                发布时间：${escapeHtml(time)}
            </span>
        </div>
    `;

    if(news.url){

        item.addEventListener("click",()=>{

            window.open(
                news.url,
                "_blank",
                "noopener,noreferrer"
            );

        });

    }

    return item;
}


async function loadNews(){

    const app =
        document.getElementById("app");

    try{

        /*
         * 加时间戳 + no-store，
         * 防止 GitHub Pages / CDN 使用旧 news.json。
         */
        const response =
            await fetch(
                "./news.json?ts="+Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "news.json 加载失败，HTTP "+
                response.status
            );

        }

        const data =
            await response.json();


        if(!data || typeof data !== "object"){

            throw new Error(
                "news.json 数据格式无效"
            );

        }


        /*
         * 顶部信息
         */
        document.getElementById("update").textContent =
            "最后自动更新：" +
            (data.update_cst || "未知");

        document.getElementById("count").textContent =
            "当前新闻总数：" +
            (data.total_count ?? 0) +
            " 条";


        /*
         * 来源统计
         */
        const stats =
            document.getElementById("stats");

        stats.innerHTML = "";

        if(
            data.source_stat &&
            typeof data.source_stat === "object"
        ){

            Object.entries(data.source_stat)
                .forEach(([source,count])=>{

                    const tag =
                        document.createElement("span");

                    tag.className = "tag";

                    tag.textContent =
                        source + "：" +
                        count + "条";

                    stats.appendChild(tag);

                });

        }


        /*
         * 新版 Python 的两个独立数组。
         *
         * 第一部分：
         * China Buzzing 10条
         */
        let chinaNews =
            Array.isArray(data.china_news)
                ? data.china_news
                : [];


        /*
         * 第二部分：
         * 五大外媒已经在 Python 中混编。
         */
        let mediaNews =
            Array.isArray(data.media_news)
                ? data.media_news
                : [];


        /*
         * 兼容旧 news.json。
         * 正常情况下不会走这里。
         */
        if(
            chinaNews.length === 0 &&
            Array.isArray(data.news)
        ){

            chinaNews =
                data.news
                    .filter(
                        item =>
                        (item.source || "") ===
                        "China Buzzing"
                    );

        }


        if(
            mediaNews.length === 0 &&
            Array.isArray(data.news)
        ){

            mediaNews =
                data.news
                    .filter(
                        item =>
                        (item.source || "") !==
                        "China Buzzing"
                    );

        }


        /*
         * 第一部分：
         * 严格最新10条
         */
        chinaNews =
            sortNewest(chinaNews)
                .slice(0,10);


        /*
         * 第二部分：
         * 严格最新20条。
         *
         * 注意：
         * 这里绝对不按照 source 分组。
         */
        mediaNews =
            sortNewest(mediaNews)
                .slice(0,20);


        /*
         * 清空 loading
         */
        app.innerHTML = "";


        /*
         * =========================
         * 第一部分
         * China Buzzing 最新10条
         * =========================
         */
        const chinaSection =
            document.createElement("section");

        chinaSection.className =
            "section";


        chinaSection.innerHTML =
            `<div class="section-title">
                🇨🇳 最新10条中国新闻
             </div>`;


        if(chinaNews.length === 0){

            chinaSection.innerHTML +=
                `<div class="empty">
                    暂无 China Buzzing 新闻
                 </div>`;

        }else{

            chinaNews.forEach(news=>{

                chinaSection.appendChild(
                    createNewsItem(news)
                );

            });

        }


        app.appendChild(chinaSection);


        /*
         * =========================
         * 第二部分
         * 五大外媒科技/财经/商业最新20条
         * =========================
         */
        const mediaSection =
            document.createElement("section");

        mediaSection.className =
            "section media-section";


        mediaSection.innerHTML =
            `<div class="section-title">
                🌍 科技 · 财经 · 商业最新20条
             </div>`;


        if(mediaNews.length === 0){

            mediaSection.innerHTML +=
                `<div class="empty">
                    暂无符合条件的外媒新闻
                 </div>`;

        }else{

            /*
             * 关键：
             *
             * 这里直接遍历 mediaNews。
             *
             * 不建立 groupMap。
             * 不按照 Reuters / Bloomberg /
             * FT / WSJ / Economist 分组。
             *
             * 五家媒体完全混排。
             */
            mediaNews.forEach(news=>{

                mediaSection.appendChild(
                    createNewsItem(news)
                );

            });

        }


        app.appendChild(mediaSection);


    }catch(error){

        console.error(
            "新闻页面加载失败：",
            error
        );

        app.innerHTML =
            `<div class="section error">
                <b>新闻页面加载失败</b>
                <br><br>
                ${escapeHtml(error.message)}
                <br><br>
                请检查 GitHub Actions 是否已经生成
                news.json。
             </div>`;

    }

}


document.addEventListener(
    "DOMContentLoaded",
    loadNews
);
</script>

</body>
</html>
'''
